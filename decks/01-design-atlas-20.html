<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina Ring 商業產品發表（20 頁）— Slide Atelier V5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../engine/stage.css" />
  <style>
    .studio-quick-pill { position: fixed; top: 14px; right: 16px; z-index: 80; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
    .studio-pill-btn {
      appearance: none; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(10px);
      color: #f8fafc; border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 999px;
      padding: 8px 15px; font-size: 12.5px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    .studio-pill-dot { width: 8px; height: 8px; border-radius: 50%; background: #38bdf8; }
    .studio-quick-panel {
      position: absolute; top: calc(100% + 8px); right: 0; width: 390px; max-height: 78vh; overflow-y: auto;
      background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 14px; padding: 14px;
      color: #f8fafc; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); display: none;
    }
    .studio-quick-panel.is-open { display: block; }
    .sq-label { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; color: #94a3b8; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; }
    .sq-group { margin-bottom: 12px; }
    .sq-group:last-child { margin-bottom: 0; }
    .sq-grid { display: flex; flex-wrap: wrap; gap: 5px; }
    .sq-chip {
      appearance: none; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e2e8f0; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
    }
    .sq-chip.is-active { background: #38bdf8; border-color: #38bdf8; color: #0f172a; font-weight: 700; }
    @media print { .studio-quick-pill { display: none !important; } }
  </style>
</head>
<body>
  <div class="studio-quick-pill" id="studioQuickPill">
    <button type="button" class="studio-pill-btn" id="studioPillToggle">
      <span class="studio-pill-dot"></span>
      <span>換主題 / 模板 / 配色 / 字體 / 版面</span>
    </button>
    <div class="studio-quick-panel" id="studioQuickPanel">
      <div class="sq-group"><div class="sq-label"><span>簡報主題 (3)</span></div><div class="sq-grid" id="sqTopics"></div></div>
      <div class="sq-group"><div class="sq-label"><span>模板骨架 (6)</span></div><div class="sq-grid" id="sqTemplates"></div></div>
      <div class="sq-group"><div class="sq-label"><span>配色方案 (8)</span></div><div class="sq-grid" id="sqColors"></div></div>
      <div class="sq-group"><div class="sq-label"><span>字體搭配 (4)</span></div><div class="sq-grid" id="sqFonts"></div></div>
      <div class="sq-group">
        <div class="sq-label"><span>切換本頁版面 (30 · 內容不變)</span><button type="button" class="sq-chip" id="sqResetPage" style="padding:2px 7px;font-size:10px;display:none;">還原預設</button></div>
        <div class="sq-grid" id="sqLayouts"></div>
      </div>
    </div>
  </div>

  <main class="deck" id="atlasDeck" data-deck-title="Lumina 商業簡報 · 科技發表會暗黑風 (20頁)"></main>

  <script src="../engine/template-svgs.js"></script>
  <script src="../engine/renderer.js"></script>
  <script src="../engine/pptx-exporter.js"></script>
  <script>
    (() => {
      const SR = window.SlideRenderer;
      const ASSET_BASE = "../assets/";
      const state = {
        topic: "lumina-pitch",
        template: "keynote-dark",
        color: "obsidian-cyan",
        font: "sans-modern",
        pageOverrides: {}
      };
      const recipe = () => ({ templateId: state.template, colorId: state.color, fontId: state.font });

      const deckEl = document.getElementById("atlasDeck");
      SR.render20Slides(deckEl, recipe(), state.pageOverrides, state.topic, ASSET_BASE);

      const getCurIdx = () => Math.max(0, Array.from(deckEl.querySelectorAll(".slide")).findIndex((s) => s.classList.contains("is-active")));
      const toggleBtn = document.getElementById("studioPillToggle");
      const quickPanel = document.getElementById("studioQuickPanel");
      const sqTopics = document.getElementById("sqTopics");
      const sqTemplates = document.getElementById("sqTemplates");
      const sqColors = document.getElementById("sqColors");
      const sqFonts = document.getElementById("sqFonts");
      const sqLayouts = document.getElementById("sqLayouts");
      const sqResetPage = document.getElementById("sqResetPage");

      function renderQuickPanel() {
        const curIdx = getCurIdx();
        const plan = SR.getDeckPlan(recipe(), state.pageOverrides, state.topic, ASSET_BASE);
        const curMode = plan[curIdx]?.mode || "dual-nested-stat";
        sqTopics.innerHTML = SR.TOPICS.map((t) => `<button type="button" class="sq-chip ${t.id === state.topic ? "is-active" : ""}" data-topic="${t.id}">${t.shortLabel || t.label}</button>`).join("");
        sqTemplates.innerHTML = SR.MASTER_TEMPLATES.map((tpl) => `<button type="button" class="sq-chip ${tpl.id === state.template ? "is-active" : ""}" data-template="${tpl.id}">${tpl.name}</button>`).join("");
        sqColors.innerHTML = SR.COLOR_PALETTES.map((c) => `<button type="button" class="sq-chip ${c.id === state.color ? "is-active" : ""}" data-color="${c.id}">${c.name}</button>`).join("");
        sqFonts.innerHTML = SR.FONT_PAIRINGS.map((f) => `<button type="button" class="sq-chip ${f.id === state.font ? "is-active" : ""}" data-font="${f.id}">${f.name}</button>`).join("");
        sqLayouts.innerHTML = SR.COMPOUND_LAYOUTS.map((l) => `<button type="button" class="sq-chip ${l.id === curMode ? "is-active" : ""}" data-layout="${l.id}">${l.label}</button>`).join("");
        sqResetPage.style.display = state.pageOverrides[curIdx] ? "inline-flex" : "none";
      }

      function refreshDeckLive() {
        const plan = SR.getDeckPlan(recipe(), state.pageOverrides, state.topic, ASSET_BASE);
        const tpl = SR.getTemplate(recipe());
        Array.from(deckEl.querySelectorAll(".slide")).forEach((slideEl, idx) => {
          const data = plan[idx];
          if (data) slideEl.innerHTML = `${SR.renderSlideInner(recipe(), data)}<aside class="notes">第 ${data.num} 頁（版面：${data.mode}）— ${data.title}。</aside>`;
        });
        const top = SR.TOPICS.find((t) => t.id === state.topic) || SR.TOPICS[0];
        const titleText = `${top.shortLabel || top.label} · ${tpl.name} (20頁)`;
        deckEl.dataset.deckTitle = titleText;
        const hudTitle = document.querySelector(".hud-title");
        if (hudTitle) hudTitle.textContent = titleText;
        renderQuickPanel();
      }

      toggleBtn.addEventListener("click", (e) => { e.stopPropagation(); renderQuickPanel(); quickPanel.classList.toggle("is-open"); });
      document.addEventListener("click", (e) => { if (!e.target.closest("#studioQuickPill")) quickPanel.classList.remove("is-open"); });
      sqTopics.addEventListener("click", (e) => { const b = e.target.closest("button[data-topic]"); if (b) { state.topic = b.dataset.topic; state.pageOverrides = {}; refreshDeckLive(); } });
      sqTemplates.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-template]");
        if (b) {
          state.template = b.dataset.template;
          const tplObj = SR.MASTER_TEMPLATES.find((t) => t.id === state.template);
          if (tplObj) { state.color = tplObj.defaultColor; state.font = tplObj.defaultFont; }
          refreshDeckLive();
        }
      });
      sqColors.addEventListener("click", (e) => { const b = e.target.closest("button[data-color]"); if (b) { state.color = b.dataset.color; refreshDeckLive(); } });
      sqFonts.addEventListener("click", (e) => { const b = e.target.closest("button[data-font]"); if (b) { state.font = b.dataset.font; refreshDeckLive(); } });
      sqLayouts.addEventListener("click", (e) => { const b = e.target.closest("button[data-layout]"); if (b) { state.pageOverrides[getCurIdx()] = b.dataset.layout; refreshDeckLive(); } });
      sqResetPage.addEventListener("click", () => { delete state.pageOverrides[getCurIdx()]; refreshDeckLive(); });
      window.addEventListener("hashchange", () => { if (quickPanel.classList.contains("is-open")) renderQuickPanel(); });
    })();
  </script>
  <script src="../engine/deck.js"></script>
</body>
</html>
