<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Slide Atelier｜簡報放映</title>
  <link rel="stylesheet" href="../engine/stage.css">
  <script>window.addEventListener("DOMContentLoaded",()=>{const fontSheet=document.createElement("link");fontSheet.rel="stylesheet";fontSheet.href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap";document.head.append(fontSheet);},{once:true});</script>
  <style>
    #studioQuickPill{position:fixed;right:16px;top:16px;z-index:1000;font:14px system-ui,sans-serif}#studioPillToggle{padding:10px 16px;background:#fffdf9;color:#1d2626;border:1px solid #d7cebc;border-radius:8px;cursor:pointer}#studioQuickPanel{display:none;max-width:min(420px,90vw);max-height:75vh;overflow:auto;background:#fffdf9;color:#1d2626;padding:24px;border:1px solid #d7cebc;border-radius:8px;margin-top:8px}#studioQuickPanel.is-open{display:block}.sq-label{font-weight:700;margin:16px 0 8px}.sq-grid{display:flex;gap:8px;flex-wrap:wrap}.sq-chip{padding:8px;border:1px solid #d7cebc;background:#fff;color:#1d2626;cursor:pointer;border-radius:4px}.sq-chip.is-active{background:#0d4f4f;color:#fff}.sq-help{font-size:13px;line-height:1.6;color:#5d6a6a}@media print{#studioQuickPill{display:none}}
  </style>
</head>
<body>
  <div id="studioQuickPill"><button type="button" id="studioPillToggle" aria-expanded="false">簡報設定</button><div id="studioQuickPanel"><div class="sq-label">主題</div><div id="sqTopics" class="sq-grid"></div><div class="sq-label">整份簡報風格</div><div id="sqPresets" class="sq-grid"></div><div class="sq-label">本頁版面</div><div id="sqLayouts" class="sq-grid"></div><p class="sq-help">每套風格包含固定的色彩與字體。變更風格或版面會重新套用設計，內容文字與新增物件會保留。</p></div></div>
  <main class="deck" id="studioDeck"></main>
  <script src="../engine/template-svgs.js"></script>
  <script src="../engine/content-state.js?v=adaptive-prose-1"></script>
  <script src="../engine/renderer.js?v=adaptive-prose-1"></script>
  <script src="../engine/ziwei-deck.js?v=adaptive-prose-1"></script>
  <script src="../engine/pptx-exporter.js"></script>
  <script src="../engine/importer.js?v=controls-audit"></script>
  <script>
    (() => {
      const SR = window.SlideRenderer;
      const KEY = "slide_atelier_v6_state";
      window.SlideImporter.registerAllIntoRenderer(SR);
      const read = (raw) => { try { return JSON.parse(raw || "{}"); } catch { return {}; } };
      const saved = read(localStorage.getItem(KEY));
      const match = location.hash.match(/state=([^&]+)/);
      let fromHash = {};
      try { if (match) fromHash = read(decodeURIComponent(match[1])); } catch {}
      const state = {topic:"ziwei-reading",template:"editorial-magazine",page:0,pageOverrides:{},customHtmlByPage:{},...saved,...fromHash};
      const topicParam = new URLSearchParams(location.search).get("topic");
      let overridesByTopic={};try{overridesByTopic=read(localStorage.getItem("slide_atelier_content_by_topic"));}catch{}
      if (topicParam) { state.topic = topicParam; state.page = 0; state.pageOverrides = overridesByTopic[state.topic]||{}; }
      else if(overridesByTopic[state.topic]) state.pageOverrides=overridesByTopic[state.topic];
      if (!SR.TOPICS.some(t=>t.id===state.topic)) state.topic="cafe-brand";
      if (saved.topic !== state.topic) state.customHtmlByPage = {};
      const tpl = SR.getTemplate({templateId:state.template});
      state.template=tpl.tplId; state.color=tpl.colorId; state.font=tpl.fontId;
      const recipe={templateId:state.template};
      const deck=document.getElementById("studioDeck");
      const plan=SR.getDeckPlan(recipe,state.pageOverrides,state.topic,"../assets/");
      const initialHash = /^#\d+$/.test(location.hash) ? Number(location.hash.slice(1))-1 : Number(state.page)||0;
      state.page=Math.max(0,Math.min(plan.length-1,initialHash));
      history.replaceState(null,"",`${location.pathname}#${state.page+1}`);
      const top=SR.TOPICS.find(t=>t.id===state.topic);
      deck.dataset.deckTitle=`${top.shortLabel} · ${tpl.name}（${plan.length}頁）`;
      plan.forEach((data,i)=>{
        const slide=document.createElement("section"); slide.className="slide";
        const cached=state.customHtmlByPage[`${state.topic}_${i}`];
        slide.innerHTML=(state.topic!=="ziwei-reading" || cached?.includes('data-design-revision="adaptive-prose-1"')?cached:null) || SR.renderSlideInner(recipe,data);
        window.SlideContent.bind(slide,data);
        const notes=document.createElement("aside");notes.className="notes";notes.textContent=data.notes || "";slide.append(notes);deck.append(slide);
      });
      const current=()=>Math.max(0,Array.from(deck.children).findIndex(s=>s.classList.contains("is-active")));
      const save=()=>{state.page=current();overridesByTopic[state.topic]=state.pageOverrides;try{localStorage.setItem("slide_atelier_content_by_topic",JSON.stringify(overridesByTopic));localStorage.setItem(KEY,JSON.stringify(state));}catch{}};
      window.addEventListener("atelier:slidechange",save);
      // Changes made during playback survive returning to the studio.
      deck.addEventListener("input",e=>{const slide=e.target.closest(".slide");if(!slide)return;const index=Array.from(deck.children).indexOf(slide),prev=state.pageOverrides[index];state.pageOverrides[index]={...(typeof prev==="string"?{mode:prev}:prev||{}),content:window.SlideContent.capture(slide,plan[index])};const clone=slide.cloneNode(true);clone.querySelectorAll(".notes").forEach(n=>n.remove());clone.querySelectorAll("[contenteditable]").forEach(n=>n.removeAttribute("contenteditable"));state.customHtmlByPage[`${state.topic}_${Array.from(deck.children).indexOf(slide)}`]=clone.innerHTML;save();});
      const button=document.getElementById("studioPillToggle"),panel=document.getElementById("studioQuickPanel");
      const chips=(id,items,selected,choose)=>{const host=document.getElementById(id);host.replaceChildren();items.forEach(item=>{const b=document.createElement("button");b.type="button";b.className=`sq-chip ${selected===item.id?"is-active":""}`;b.textContent=item.label||item.name;b.addEventListener("click",()=>choose(item));host.append(b);});};
      const reload=()=>{save();location.reload();};
      const renderPanel=()=>{
        chips("sqTopics",SR.TOPICS,state.topic,t=>{overridesByTopic[state.topic]=state.pageOverrides;state.topic=t.id;state.pageOverrides=overridesByTopic[t.id]||{};state.customHtmlByPage={};state.page=0;try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}location.href=`${location.pathname}#1`;location.reload();});
        chips("sqPresets",SR.STYLE_PRESETS,SR.STYLE_PRESETS.find(p=>p.templateId===state.template)?.id,p=>{state.template=p.templateId;state.color=p.colorId;state.font=p.fontId;state.customHtmlByPage={};reload();});
        chips("sqLayouts",SR.COMPOUND_LAYOUTS,plan[current()].mode,l=>{const i=current(),prev=state.pageOverrides[i];state.pageOverrides[i]={...(typeof prev==="string"?{mode:prev}:prev||{}),mode:l.id};delete state.customHtmlByPage[`${state.topic}_${current()}`];reload();});
      };
      button.addEventListener("click",()=>{renderPanel();panel.classList.toggle("is-open");button.setAttribute("aria-expanded",String(panel.classList.contains("is-open")));});
      window.addEventListener("hashchange",()=>{if(panel.classList.contains("is-open"))renderPanel();});
      try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}
    })();
  </script>
  <script src="../engine/deck.js?v=controls-audit"></script>
</body>
</html>
