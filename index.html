<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slide Atelier — 互動式簡報設計工作室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>window.addEventListener("DOMContentLoaded",()=>{const fontSheet=document.createElement("link");fontSheet.rel="stylesheet";fontSheet.href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap";document.head.append(fontSheet);},{once:true});</script>
  <style>
    :root {
      --bg: #f3efe7;
      --surface: #ffffff;
      --tint: #ebe4d5;
      --fg: #1d2626;
      --muted: #5d6a6a;
      --border: #d7cebc;
      --primary: #0d4f4f;
      --secondary: #9e5a38;
      --sans: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      --serif: "Noto Serif TC", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      height: 50px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-family: var(--serif); font-weight: 900; font-size: 1.12rem; color: var(--primary); }
    .brand-tag {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: #e3eded;
      padding: 2px 10px;
      border-radius: 999px;
    }

    .top-actions { display: flex; align-items: center; gap: 8px; }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      padding: 5px 11px;
      border-radius: 7px;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 120ms ease;
    }

    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #ffffff; }
    .btn-primary:hover { background: #093b3b; border-color: #093b3b; color: #ffffff; }
    .btn-accent { background: var(--secondary); border-color: var(--secondary); color: #ffffff; }
    .btn-accent:hover { background: #7f4428; border-color: #7f4428; color: #ffffff; }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 382px 1fr;
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 12px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .sidebar::-webkit-scrollbar { width: 5px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .ctrl-block { display: flex; flex-direction: column; gap: 6px; }
    .ctrl-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
    }
    .ctrl-count { font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-weight: 600; }

    .topic-stack { display: flex; flex-direction: column; gap: 5px; }
    .topic-btn {
      appearance: none;
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      color: var(--fg);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topic-btn:hover { border-color: var(--primary); }
    .topic-btn.is-active {
      background: #e5f0f0;
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: inset 0 0 0 1px var(--primary);
    }

    .preset-stack { display: flex; flex-direction: column; gap: 6px; }
    .preset-btn {
      appearance: none;
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      color: var(--fg);
      font-family: var(--sans);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .preset-btn:hover { border-color: var(--primary); }
    .preset-btn.is-active {
      background: var(--surface);
      border-color: var(--primary);
      box-shadow: inset 0 0 0 1.5px var(--primary);
    }
    .preset-info { min-width: 0; }
    .preset-name { display: block; font-size: 12px; font-weight: 800; line-height: 1.3; color: var(--fg); }
    .preset-desc { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .color-swatches { display: inline-flex; gap: 3px; flex-shrink: 0; }
    .color-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.18); }

    .layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .layout-btn {
      appearance: none;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 8px;
      cursor: pointer;
      color: var(--fg);
      font-family: var(--sans);
    }
    .layout-btn:hover { border-color: var(--secondary); }
    .layout-btn.is-active { background: var(--secondary); border-color: var(--secondary); color: #ffffff; }
    .layout-title {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .layout-meta {
      display: block;
      margin-top: 2px;
      font-size: 9.5px;
      opacity: 0.78;
    }

    .stage-area {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 8px 18px 12px;
      gap: 7px;
    }

    .stage-bar {
      min-height: 34px;
      height: auto;
      flex-wrap: wrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .nav-group { display: flex; align-items: center; gap: 6px; min-width:0; flex:1; }
    .nav-group .btn { flex-shrink:0; white-space:nowrap; }
    .nav-group .page-select { flex:1; min-width:80px; width:0; }
    @media(max-width:1200px){
      .stage-bar > .nav-group{flex:0 0 100%;width:100%}
      .stage-bar > div:not(.nav-group){width:100%;min-width:0;justify-content:space-between}
      .mode-badge{min-width:0;max-width:72%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    }

    .page-select {
      appearance: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 24px 5px 10px;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      color: var(--fg);
      max-width: 320px;
      cursor: pointer;
      outline: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--primary) 50%), linear-gradient(135deg, var(--primary) 50%, transparent 50%);
      background-position: calc(100% - 14px) 11px, calc(100% - 9px) 11px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .page-select:focus { border-color: var(--primary); }

    .mode-badge {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: #f5e8df;
      color: var(--secondary);
    }

    /* 完整簡報編輯器工具列 */
    .editor-ribbon {
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 5px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .editor-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }
    .ed-sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }
    .ed-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      border-radius: 5px;
      padding: 3px 7px;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .ed-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .ed-btn.is-on { background: var(--primary); border-color: var(--primary); color: #ffffff; }
    .ed-btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .ed-btn-insert { background: #eaf4f4; border-color: #9dc5c5; color: var(--primary); }
    .ed-btn-danger { background: #fdf2f2; border-color: #e5b4b4; color: #b91c1c; }

    .ed-select {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      border-radius: 5px;
      padding: 2px 5px;
      font-size: 11px;
      font-weight: 600;
      height: 23px;
    }
    .ed-select:disabled { opacity: 0.4; }
    .ed-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .ed-color {
      width: 22px;
      height: 20px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }
    .ed-color:disabled { opacity: 0.4; }
    .ed-status {
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
    }

    .stage-viewport {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .stage-frame {
      width: 1280px;
      height: 720px;
      flex-shrink: 0;
      transform-origin: center center;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.14);
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: transparent;
      user-select: none;
    }

    .stage-frame [data-edit-selected="true"] {
      outline: 2px dashed #2563eb !important;
      outline-offset: -2px;
      cursor: move !important;
    }
    .stage-frame [contenteditable="true"]:focus {
      outline: 2px solid #2563eb !important;
      outline-offset: -2px;
      cursor: text !important;
      user-select: text !important;
    }
    .stage-frame [data-el] {
      pointer-events: auto !important;
    }

    @media (max-width: 960px) {
      html, body { height: auto; overflow: auto; }
      .workspace { grid-template-columns: 1fr; }
      .stage-viewport { min-height: 320px; }
    }

    .import-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.56);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .import-modal-backdrop.is-open { display: flex; }
    .import-modal {
      width: min(720px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .import-dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .import-dropzone:hover, .import-dropzone.is-dragover {
      border-color: #0f5257;
      background: #f0fdf9;
    }
    .import-textarea {
      width: 100%;
      min-height: 190px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.55;
      resize: vertical;
      color: var(--fg);
    }
    .import-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 10px;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--fg);
    }
    .topic-row {
      display: flex;
      align-items: stretch;
      gap: 4px;
    }
    .topic-row .topic-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .topic-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      background: #e2e8f0;
      color: #334155;
    }
    .topic-badge.is-custom {
      background: #d1fae5;
      color: #065f46;
    }
    .topic-del-btn {
      appearance: none;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--bg);
      color: #991b1b;
      border-radius: 7px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .topic-del-btn:hover {
      background: #fee2e2;
      border-color: #f87171;
    }
    .import-solid-btn {
      width: 100%;
      justify-content: center;
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      font-weight: 800;
      padding: 8px 12px;
      margin-bottom: 6px;
    }
    .import-solid-btn:hover {
      background: #0a3c40;
      border-color: #0a3c40;
      color: #ffffff;
    }
  </style>
  <style>
    @media(max-width:960px){
      html,body{height:auto;min-height:100vh;overflow:auto;display:block}
      .topbar{height:auto;min-height:50px;padding:12px;flex-wrap:wrap;align-items:flex-start}
      .brand{width:100%}.top-actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
      .top-actions .btn{white-space:normal;text-align:center;line-height:1.5;padding:8px}
      .workspace{display:flex;flex-direction:column;height:auto;overflow:visible}
      .sidebar{order:1;width:100%;max-height:360px;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}
      .stage-area{order:0;width:100%;min-width:0;overflow:visible;padding:12px}
      .stage-bar,.editor-row{flex-wrap:wrap;min-width:0}.nav-group{flex-wrap:nowrap;width:100%}.page-select{max-width:none}.stage-bar{order:0}.editor-ribbon{order:2}
      .stage-viewport{order:1;flex:none;height:clamp(220px,50vw,460px);min-height:220px}.editor-ribbon{overflow:visible}
    }
  </style>
<style>@media(max-width:760px){.import-modal-backdrop{padding:12px}.import-modal{width:100%;min-width:0}.import-modal [style*="display:flex"]{flex-wrap:wrap;gap:8px}.import-modal .btn,.import-modal .ed-btn{white-space:normal}}</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">Slide Atelier</span>
    </div>
    <nav class="top-actions">
      <a class="btn" href="project.html">專案介紹與擴充規則</a>
      <a class="btn" href="decks/showcase-20.html">AI 資安論文版</a>
      <a class="btn" href="decks/01-design-atlas-20.html">Lumina 商業企劃版</a>
      <button type="button" class="btn btn-accent" id="downloadPptBtn">⬇ 下載可編輯 PPT (.pptx)</button>
      <a class="btn btn-primary" id="openDeckBtn" href="decks/studio-deck.html">放映與匯出 PDF →</a>
    </nav>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <section class="ctrl-block">
        <div class="ctrl-head">
          <span>1. 簡報主題與範例</span>
        </div>
        <div class="topic-stack" id="topicBar"></div><p style="font-size:11px;line-height:1.5;color:var(--muted);margin:8px 0 0;">保留原有三份 20 頁示範；示範中的研究及商業數據不作為已查證事實，正式使用請以你的來源替換。</p>
      </section>

      <section class="ctrl-block">
        <div class="ctrl-head">
          <span>2. 選擇視覺風格（4 套完整搭配）</span>
          <span class="ctrl-count">精選套裝</span>
        </div>
        <div class="preset-stack" id="stylePresetBar"></div>
      </section>

      <section class="ctrl-block" style="flex:1;">
        <div class="ctrl-head">
          <span>3. 切換本頁版面</span>
          <button type="button" class="btn" id="resetPageBtn" style="padding:2px 8px;font-size:10.5px;visibility:hidden;">還原版面</button>
        </div>
        <div class="layout-grid" id="layoutSwitcher"></div>
      </section>
    </aside>

    <section class="stage-area">
      <div class="stage-bar">
        <div class="nav-group">
          <button type="button" class="btn" id="prevBtn">← 上一頁</button>
          <select class="page-select" id="pageSelect" aria-label="選擇投影片頁碼"></select>
          <button type="button" class="btn" id="nextBtn">下一頁 →</button>
        </div>
        <div class="nav-group">
          <span class="mode-badge" id="stageModeLabel">banner-3-rows</span>
          <span style="font-size:11.5px;color:var(--muted);">可用 ← / → 翻頁</span>
        </div>
      </div>

      <!-- 完整簡報編輯器工具列 -->
      <div class="editor-ribbon">
        <div class="editor-row">
          <button type="button" class="ed-btn" id="edUndo" disabled title="復原上一步 (Ctrl+Z)">↶ 復原</button>
          <button type="button" class="ed-btn" id="edRedo" disabled title="重做 (Ctrl+Y)">↷ 重做</button>
          <span class="ed-sep"></span>
          <label class="ed-label" for="elTextTarget">修改</label>
          <select class="ed-select" id="elTextTarget" aria-label="選擇要修改的文字" style="max-width:210px"></select>
          <label class="ed-label" for="elFontFamily">字體</label>
          <select class="ed-select" id="elFontFamily" disabled title="元素字型" aria-label="字體">
            <option value="">字型預設</option>
            <option value="'Noto Sans TC', 'Microsoft JhengHei', sans-serif">思源黑體</option>
            <option value="'Noto Serif TC', 'PMingLiU', Georgia, serif">思源宋體 (明體)</option>
            <option value="'Cormorant Garamond', 'Noto Serif TC', Georgia, serif">歐美襯線</option>
            <option value="'JetBrains Mono', Consolas, monospace">工程等寬體</option>
            <option value="'Microsoft JhengHei', sans-serif">微軟正黑體</option>
            <option value="'PMingLiU', serif">新細明體</option>
            <option value="'DFKai-SB', 'BiauKai', serif">標楷體</option>
          </select>
          <label class="ed-label" for="elFontSize">大小</label>
          <select class="ed-select" id="elFontSize" disabled title="文字大小" aria-label="文字大小">
            <option value="">字號</option>
            <option value="52px">52</option>
            <option value="22px">22</option>
            <option value="17px">17</option>
            <option value="13px">13</option>
            <option value="14px">14</option>
            <option value="16px">16</option>
            <option value="18px">18</option>
            <option value="20px">20</option>
            <option value="24px">24</option>
            <option value="28px">28</option>
            <option value="32px">32</option>
            <option value="36px">36</option>
            <option value="42px">42</option>
            <option value="48px">48</option>
            <option value="60px">60</option>
            <option value="72px">72</option>
          </select>
          <button type="button" class="ed-btn" id="elFontDn" disabled title="縮小文字">A-</button>
          <button type="button" class="ed-btn" id="elFontUp" disabled title="放大文字">A+</button>
          <button type="button" class="ed-btn" id="elBold" disabled title="粗體"><b>B</b></button>
          <button type="button" class="ed-btn" id="elItalic" disabled title="斜體"><i>I</i></button>
          <button type="button" class="ed-btn" id="elUnderline" disabled title="底線"><u>U</u></button>
          <span class="ed-sep"></span>
          <button type="button" class="ed-btn" id="elAlignLeft" disabled title="靠左對齊">靠左</button>
          <button type="button" class="ed-btn" id="elAlignCenter" disabled title="置中對齊">置中</button>
          <button type="button" class="ed-btn" id="elAlignRight" disabled title="靠右對齊">靠右</button>
          <label class="ed-label">字色<input type="color" class="ed-color" id="elTextColor" value="#141413" disabled /></label>
          <span class="ed-status" id="editorStatus">先點選投影片文字或物件，灰色工具才會啟用</span>
        </div>

        <div class="editor-row">
          <button type="button" class="ed-btn ed-btn-insert" id="elAddText">＋文字</button>
          <button type="button" class="ed-btn ed-btn-insert" id="elAddCard">＋色塊卡片</button>
          <button type="button" class="ed-btn ed-btn-insert" id="elAddCircle">＋圓形標籤</button>
          <button type="button" class="ed-btn ed-btn-insert" id="elAddLine">＋分隔線</button>
          <button type="button" class="ed-btn ed-btn-insert" id="elAddImage">🖼 插入圖片</button>
          <input type="file" id="elImageInput" accept="image/*" style="display:none;" />
          <span class="ed-sep"></span>
          <label class="ed-label">填色<input type="color" class="ed-color" id="elBgColor" value="#ffffff" disabled /></label>
          <button type="button" class="ed-btn" id="elBgTransparent" disabled title="設為透明背景">透明</button>
          <label class="ed-label">邊框<input type="color" class="ed-color" id="elBorderColor" value="#1d2626" disabled /></label>
          <select class="ed-select" id="elBorderWidth" disabled title="邊框粗細">
            <option value="0px">無框</option>
            <option value="1px">細框 1px</option>
            <option value="2px">中框 2px</option>
            <option value="4px">粗框 4px</option>
          </select>
          <select class="ed-select" id="elRadius" disabled title="圓角大小">
            <option value="0px">直角</option>
            <option value="8px">微圓</option>
            <option value="16px">圓角</option>
            <option value="999px">膠囊</option>
          </select>
          <span class="ed-sep"></span>
          <button type="button" class="ed-btn" id="elBringForward" disabled title="上移一層">上移</button>
          <button type="button" class="ed-btn" id="elSendBackward" disabled title="下移一層">下移</button>
          <button type="button" class="ed-btn" id="elScaleUp" disabled>放大</button>
          <button type="button" class="ed-btn" id="elScaleDn" disabled>縮小</button>
          <button type="button" class="ed-btn" id="elDuplicate" disabled>⧉ 複製</button>
          <button type="button" class="ed-btn ed-btn-danger" id="elDelete" disabled>🗑 刪除</button>
          <button type="button" class="ed-btn" id="elResetCustom" style="visibility:hidden;margin-left:auto;">↺ 還原預設</button>
        </div>
      </div>

      <div class="stage-viewport" id="stageViewport">
        <div class="stage-frame" id="stageFrame"></div>
      </div>
    </section>
  </main>

  <script src="engine/template-svgs.js"></script>
  <script src="engine/content-state.js?v=adaptive-prose-1"></script>
  <script src="engine/renderer.js?v=adaptive-prose-1"></script>
  <script src="engine/pptx-exporter.js?v=stage-units-1"></script>
  <script src="engine/topics.js?v=independent-md-1"></script>
  <script>
    (async () => {
      await window.SlideTopicsReady;
      const SR = window.SlideRenderer;
      const STORAGE_KEY = "slide_atelier_v6_state";
      const escapeText = (s) => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

      const state = {
        topic: "cafe-brand",
        template: "editorial-magazine",
        color: "cafe-terracotta",
        font: "serif-classic",
        page: 0,
        pageOverrides: {},
        customHtmlByPage: {}
      };

      try {
        const hm = location.hash.match(/state=([^&]+)/);
        const raw = hm ? decodeURIComponent(hm[1]) : localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          if (p.topic && SR.TOPICS.some((t) => t.id === p.topic)) state.topic = p.topic;
          if (p.template && SR.MASTER_TEMPLATES.some((t) => t.id === p.template)) state.template = p.template;
          if (p.color && SR.COLOR_PALETTES.some((c) => c.id === p.color)) state.color = p.color;
          if (p.font && SR.FONT_PAIRINGS.some((f) => f.id === p.font)) state.font = p.font;
          if (typeof p.page === "number") state.page = Math.max(0, p.page);
          if (p.pageOverrides && typeof p.pageOverrides === "object") state.pageOverrides = p.pageOverrides;
          if (p.customHtmlByPage && typeof p.customHtmlByPage === "object") state.customHtmlByPage = p.customHtmlByPage;
        }
      } catch {}

      const contentApi = window.SlideContent;
      const queryTopic = new URLSearchParams(location.search).get("topic");
      if (queryTopic && SR.TOPICS.some(t=>t.id===queryTopic)) {
        if (state.topic !== queryTopic) state.pageOverrides = {};
        state.topic=queryTopic;state.page=0;
      }
      let overridesByTopic = {};
      try { overridesByTopic=JSON.parse(localStorage.getItem("slide_atelier_content_by_topic")||"{}"); } catch {}
      if (overridesByTopic[state.topic]) state.pageOverrides=overridesByTopic[state.topic];
      const queryStyle=new URLSearchParams(location.search).get("style");
      if(queryStyle && SR.STYLE_PRESETS.some(p=>p.templateId===queryStyle))state.template=queryStyle;
      const topicBar = document.getElementById("topicBar");
      const stylePresetBar = document.getElementById("stylePresetBar");
      const layoutSwitcher = document.getElementById("layoutSwitcher");
      const resetPageBtn = document.getElementById("resetPageBtn");
      const pageSelect = document.getElementById("pageSelect");
      const stageModeLabel = document.getElementById("stageModeLabel");
      const stageViewport = document.getElementById("stageViewport");
      const stageFrame = document.getElementById("stageFrame");
      const openDeckBtn = document.getElementById("openDeckBtn");
      const downloadPptBtn = document.getElementById("downloadPptBtn");

      const edUndo = document.getElementById("edUndo");
      const edRedo = document.getElementById("edRedo");
      const elTextTarget=document.getElementById("elTextTarget");
      let textTargets=[];
      const elFontFamily = document.getElementById("elFontFamily");
      const elFontSize = document.getElementById("elFontSize");
      const elFontUp = document.getElementById("elFontUp");
      const elFontDn = document.getElementById("elFontDn");
      const elBold = document.getElementById("elBold");
      const elItalic = document.getElementById("elItalic");
      const elUnderline = document.getElementById("elUnderline");
      const elAlignLeft = document.getElementById("elAlignLeft");
      const elAlignCenter = document.getElementById("elAlignCenter");
      const elAlignRight = document.getElementById("elAlignRight");
      const elTextColor = document.getElementById("elTextColor");

      const elBgColor = document.getElementById("elBgColor");
      const elBgTransparent = document.getElementById("elBgTransparent");
      const elBorderColor = document.getElementById("elBorderColor");
      const elBorderWidth = document.getElementById("elBorderWidth");
      const elRadius = document.getElementById("elRadius");
      const elBringForward = document.getElementById("elBringForward");
      const elSendBackward = document.getElementById("elSendBackward");
      const elScaleUp = document.getElementById("elScaleUp");
      const elScaleDn = document.getElementById("elScaleDn");
      const elDuplicate = document.getElementById("elDuplicate");
      const elDelete = document.getElementById("elDelete");

      const elAddText = document.getElementById("elAddText");
      const elAddCard = document.getElementById("elAddCard");
      const elAddCircle = document.getElementById("elAddCircle");
      const elAddLine = document.getElementById("elAddLine");
      const elAddImage = document.getElementById("elAddImage");
      const elImageInput = document.getElementById("elImageInput");
      const elResetCustom = document.getElementById("elResetCustom");
      const editorStatus = document.getElementById("editorStatus");

      const SELECTION_REQUIRED_CONTROLS = [
        elFontFamily, elFontSize, elFontUp, elFontDn, elBold, elItalic, elUnderline,
        elAlignLeft, elAlignCenter, elAlignRight, elTextColor,
        elBgColor, elBgTransparent, elBorderColor, elBorderWidth, elRadius,
        elBringForward, elSendBackward, elScaleUp, elScaleDn, elDuplicate, elDelete
      ];

      let currentScale = 1;
      let selectedEl = null;
      let typingHistoryElement = null;
      const undoStacks = {};
      const redoStacks = {};

      function currentRecipe() {
        return { templateId: state.template, colorId: state.color, fontId: state.font };
      }

      function pageKey() {
        return `${state.topic}_${state.page}`;
      }

      function cleanStageSnapshotHtml() {
        const clone = stageFrame.cloneNode(true);
        clone.querySelectorAll("[data-edit-selected]").forEach((n) => n.removeAttribute("data-edit-selected"));
        clone.querySelectorAll("[contenteditable]").forEach((n) => n.removeAttribute("contenteditable"));
        return clone.innerHTML;
      }

      function pushHistory() {
        const k = pageKey();
        if (!undoStacks[k]) undoStacks[k] = [];
        undoStacks[k].push(cleanStageSnapshotHtml());
        if (undoStacks[k].length > 30) undoStacks[k].shift();
        redoStacks[k] = [];
        syncUndoButtons();
      }

      function syncUndoButtons() {
        const k = pageKey();
        edUndo.disabled = !(undoStacks[k] && undoStacks[k].length > 0);
        edRedo.disabled = !(redoStacks[k] && redoStacks[k].length > 0);
      }

      function fitStage() {
        const vw = Math.max(1, stageViewport.clientWidth - 16);
        const vh = Math.max(1, stageViewport.clientHeight - 16);
        currentScale = Math.min(vw / 1280, vh / 720, 1.35);
        stageFrame.style.transform = `scale(${currentScale})`;
      }

      new ResizeObserver(fitStage).observe(stageViewport);

      function persistState() {
        overridesByTopic[state.topic]=state.pageOverrides;
        try { localStorage.setItem("slide_atelier_content_by_topic",JSON.stringify(overridesByTopic)); } catch {}
        const litePayload = JSON.stringify({
          topic: state.topic,
          template: state.template,
          color: state.color,
          font: state.font,
          page: state.page,
          pageOverrides: state.pageOverrides
        });
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            ...JSON.parse(litePayload),
            customHtmlByPage: state.customHtmlByPage
          }));
        } catch {}
        const linkState=JSON.parse(litePayload);delete linkState.pageOverrides;
        openDeckBtn.href = `decks/studio-deck.html#state=${encodeURIComponent(JSON.stringify(linkState))}`;
      }

      function clearSelection() {
        if (selectedEl) {
          selectedEl.removeAttribute("data-edit-selected");
          if (selectedEl.getAttribute("contenteditable") === "true") selectedEl.removeAttribute("contenteditable");
        }
        selectedEl = null;
        elTextTarget.value="";
        typingHistoryElement = null;
        SELECTION_REQUIRED_CONTROLS.forEach((c) => {
          c.disabled = true;
          c.classList?.remove("is-on");
        });
        editorStatus.textContent = "先點選投影片文字或物件，灰色工具才會啟用";
      }

      function saveCustomStageHtml() {
        const plan=SR.getDeckPlan(currentRecipe(),state.pageOverrides,state.topic,"./assets/");
        const previous=state.pageOverrides[state.page];
        state.pageOverrides[state.page]={...(typeof previous==="string"?{mode:previous}:previous||{}),content:contentApi.capture(stageFrame,plan[state.page])};
        state.customHtmlByPage[pageKey()] = cleanStageSnapshotHtml();
        elResetCustom.style.visibility = "visible";
        persistState();
      }

      function commitAction(mutateFn) {
        pushHistory();
        mutateFn();
        saveCustomStageHtml();
      }

      function toHexInput(rgbStr, fallback) {
        const hex = window.SlidePptxExporter?.parseColorToHex(rgbStr);
        return hex ? `#${hex}` : fallback;
      }

      function syncControlValuesFromSelected() {
        if (!selectedEl) return;
        const cs = getComputedStyle(selectedEl);
        elTextColor.value = toHexInput(cs.color, "#141413");
        elBgColor.value = toHexInput(cs.backgroundColor, "#ffffff");
        elBorderColor.value = toHexInput(cs.borderTopColor, "#1d2626");

        const family=cs.fontFamily.split(',')[0].replace(/["']/g,'').trim().toLowerCase();
        elFontFamily.value=Array.from(elFontFamily.options).find(o=>o.value.split(',')[0].replace(/["']/g,'').trim().toLowerCase()===family)?.value || "";
        const curFs = `${Math.round(parseFloat(cs.fontSize) || 16)}px`;
        if(!Array.from(elFontSize.options).some(o=>o.value===curFs))elFontSize.add(new Option(curFs.replace('px',''),curFs));
        elFontSize.value = Array.from(elFontSize.options).some((o) => o.value === curFs) ? curFs : "";

        const fw = parseInt(cs.fontWeight, 10);
        elBold.classList.toggle("is-on", !Number.isNaN(fw) ? fw >= 600 : cs.fontWeight === "bold");
        elItalic.classList.toggle("is-on", cs.fontStyle === "italic");
        elUnderline.classList.toggle("is-on", String(cs.textDecorationLine || cs.textDecoration).includes("underline"));

        const align = cs.textAlign;
        elAlignLeft.classList.toggle("is-on", align === "left" || align === "start");
        elAlignCenter.classList.toggle("is-on", align === "center");
        elAlignRight.classList.toggle("is-on", align === "right" || align === "end");
      }

      function selectStageElement(el, makeEditable = false) {
        if (!el || el === stageFrame || el === stageFrame.firstElementChild) return;
        clearSelection();
        selectedEl = el;
        el.setAttribute("data-edit-selected", "true");
        if (makeEditable) {
          el.setAttribute("contenteditable", "true");
          el.focus();
        }
        SELECTION_REQUIRED_CONTROLS.forEach((c) => { c.disabled = false; });
        syncControlValuesFromSelected();
        const idx=textTargets.indexOf(el);elTextTarget.value=idx<0?"":String(idx);
        editorStatus.textContent = `正在修改：${el.textContent.trim().slice(0,24) || "物件"}`;
      }

      function refreshTextTargets() {
        textTargets=Array.from(stageFrame.querySelectorAll("h1,h2,h3,h4,p,strong,li,[data-content-path]"))
          .filter(el=>!el.closest("svg") && el.textContent.trim() && !el.querySelector("h1,h2,h3,h4,p,strong,li,[data-content-path]"));
        elTextTarget.replaceChildren(new Option("選擇要修改的文字", ""));
        textTargets.forEach((el,i)=>{
          const path=el.dataset.contentPath||"";
          const label=path==="title"||el.matches("h1,h2")?"本頁標題":path==="sub"?"副標題":el.matches("h3,h4,strong")?"要點標題":"正文";
          elTextTarget.add(new Option(`${label}｜${el.textContent.trim().slice(0,22)}`,String(i)));
        });
        const heading=stageFrame.querySelector('h1,h2');
        if(heading)selectStageElement(heading,false);
        else if(textTargets[0])selectStageElement(textTargets[0],false);
      }
      elTextTarget.addEventListener("change",()=>{
        const index=Number(elTextTarget.value);
        if(elTextTarget.value!=="" && textTargets[index])selectStageElement(textTargets[index],false);
      });
      const sidebarEl = document.querySelector(".sidebar");

      function render() {
        const prevScroll = sidebarEl ? sidebarEl.scrollTop : 0;
        clearSelection();
        downloadPptBtn.disabled = false; openDeckBtn.removeAttribute("aria-disabled");
        if (!SR.TOPICS.some(t => t.id === state.topic)) {
          state.topic = SR.TOPICS[0].id;
          state.page = 0;
        }
        const recipe = currentRecipe();
        const plan = SR.getDeckPlan(recipe, state.pageOverrides, state.topic, "./assets/");
        if (state.page >= plan.length) state.page = 0;
        const cur = plan[state.page];
        const key = pageKey();

        stageFrame.innerHTML = state.customHtmlByPage[key] || SR.renderSlideInner(recipe, cur);
        contentApi.bind(stageFrame, cur);
        refreshTextTargets();
        elResetCustom.style.visibility = state.customHtmlByPage[key] ? "visible" : "hidden";
        syncUndoButtons();
        fitStage();

        pageSelect.innerHTML = plan.map((s, idx) => {
          const prefix = idx === 0 ? "封面" : String(idx).padStart(2, "0");
          return `<option value="${idx}" ${idx === state.page ? "selected" : ""}>${prefix} · ${escapeText(s.title)}</option>`;
        }).join("");
        const layoutObj = SR.COMPOUND_LAYOUTS.find((l) => l.id === cur.mode);
        stageModeLabel.textContent = layoutObj ? `${layoutObj.label} (${cur.mode})` : cur.mode;

        topicBar.innerHTML = SR.TOPICS.map((t) => `
          <div class="topic-row">
            <button type="button" class="topic-btn ${t.id === state.topic ? "is-active" : ""}" data-topic="${t.id}">
              <span class="topic-badge">範例</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeText(t.label)}</span>
            </button>
          </div>
        `).join("");

        const presets = SR.STYLE_PRESETS || [];
        stylePresetBar.innerHTML = presets.map((pr) => {
          const isAct = pr.templateId === state.template && pr.colorId === state.color && pr.fontId === state.font;
          const pal = SR.COLOR_PALETTES.find((c) => c.id === pr.colorId) || SR.COLOR_PALETTES[0];
          return `
            <button type="button" class="preset-btn ${isAct ? "is-active" : ""}" data-preset="${pr.id}">
              <span class="preset-info">
                <span class="preset-name">${pr.name}</span>
                <span class="preset-desc">${pr.desc}</span>
              </span>
              <span class="color-swatches">
                <span class="color-dot" style="background:${pal.bg};"></span>
                <span class="color-dot" style="background:${pal.primary};"></span>
                <span class="color-dot" style="background:${pal.fg};"></span>
              </span>
            </button>
          `;
        }).join("");

        const coreLayouts = SR.CORE_LAYOUTS.slice();
        if (layoutObj && !coreLayouts.some((l) => l.id === layoutObj.id)) coreLayouts.push(layoutObj);
        layoutSwitcher.innerHTML = coreLayouts.map((l) => `
          <button type="button" class="layout-btn ${l.id === cur.mode ? "is-active" : ""}" data-layout="${l.id}" title="${l.desc}">
            <span class="layout-title">${l.label}</span>
            <span class="layout-meta">${SR.CORE_LAYOUTS.some(core => core.id === l.id) ? "核心 · " : "延伸 · "}${l.cat}</span>
          </button>
        `).join("");

        resetPageBtn.style.visibility = state.pageOverrides[state.page] ? "visible" : "hidden";
        if (sidebarEl) sidebarEl.scrollTop = prevScroll;
        persistState();
      }

      // Direct Drag-to-Move & Click-to-Select/Edit on Stage
      let dragTarget = null;
      let dragStartX = 0;
      let dragStartY = 0;
      let baseTx = 0;
      let baseTy = 0;
      let baseScale = 1;
      let hasDragged = false;
      let pushedDragHistory = false;

      function parseTransform(el) {
        const tx = parseFloat(el.dataset.tx || "0") || 0;
        const ty = parseFloat(el.dataset.ty || "0") || 0;
        const sc = parseFloat(el.dataset.sc || "1") || 1;
        return { tx, ty, sc };
      }

      function applyTransform(el, tx, ty, sc) {
        if (el.dataset.origTransform === undefined) {
          el.dataset.origTransform = (el.style.transform && !el.dataset.tx) ? el.style.transform : "";
        }
        el.dataset.tx = String(tx);
        el.dataset.ty = String(ty);
        el.dataset.sc = String(sc);
        const prefix = el.dataset.origTransform ? `${el.dataset.origTransform} ` : "";
        el.style.transform = `${prefix}translate(${tx}px, ${ty}px) scale(${sc})`;
      }

      stageFrame.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        const rootSlide = stageFrame.firstElementChild;
        let hit = e.target;
        if (!hit || hit === stageFrame || hit === rootSlide) {
          clearSelection();
          return;
        }
        const svgParent = hit.closest("svg");
        if (svgParent) hit = svgParent;

        if (hit.getAttribute("contenteditable") === "true" && document.activeElement === hit) return;

        dragTarget = hit;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        const t = parseTransform(hit);
        baseTx = t.tx;
        baseTy = t.ty;
        baseScale = t.sc;
        hasDragged = false;
        pushedDragHistory = false;
      });

      window.addEventListener("mousemove", (e) => {
        if (!dragTarget) return;
        const dx = (e.clientX - dragStartX) / currentScale;
        const dy = (e.clientY - dragStartY) / currentScale;
        if (!hasDragged && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
          hasDragged = true;
          if (!pushedDragHistory) {
            pushHistory();
            pushedDragHistory = true;
          }
          dragTarget.removeAttribute("contenteditable");
          selectStageElement(dragTarget, false);
        }
        if (hasDragged) {
          applyTransform(dragTarget, Math.round(baseTx + dx), Math.round(baseTy + dy), baseScale);
        }
      });

      window.addEventListener("mouseup", () => {
        if (!dragTarget) return;
        const target = dragTarget;
        dragTarget = null;
        if (hasDragged) {
          saveCustomStageHtml();
          return;
        }
        const tag = target.tagName.toLowerCase();
        const isLeafText = ["h1", "h2", "h3", "h4", "p", "span", "strong", "li", "blockquote"].includes(tag) ||
          (tag === "div" && !target.querySelector("div, p, h1, h2, h3, h4, svg, img") && target.innerText.trim().length > 0);
        selectStageElement(target, isLeafText);
      });

      stageFrame.addEventListener("pointerup",e=>{
        if(e.pointerType!=="touch")return;
        const target=e.target.closest("[data-content-path],h1,h2,h3,h4,p,strong,li");
        if(target && stageFrame.contains(target))selectStageElement(target,false);
      });
      stageFrame.addEventListener("beforeinput", () => {
        if (selectedEl && typingHistoryElement !== selectedEl) {
          pushHistory();
          typingHistoryElement = selectedEl;
        }
      });
      stageFrame.addEventListener("input", () => {
        if (!selectedEl) return;
        saveCustomStageHtml();
      });

      // Undo / Redo Actions
      function doUndo() {
        const k = pageKey();
        if (!undoStacks[k] || !undoStacks[k].length) return;
        if (!redoStacks[k]) redoStacks[k] = [];
        redoStacks[k].push(cleanStageSnapshotHtml());
        const prevHtml = undoStacks[k].pop();
        state.customHtmlByPage[k] = prevHtml;
        clearSelection();
        stageFrame.innerHTML = prevHtml;
        saveCustomStageHtml();
        elResetCustom.style.visibility = "visible";
        syncUndoButtons();
        persistState();
      }
      function doRedo() {
        const k = pageKey();
        if (!redoStacks[k] || !redoStacks[k].length) return;
        if (!undoStacks[k]) undoStacks[k] = [];
        undoStacks[k].push(cleanStageSnapshotHtml());
        const nextHtml = redoStacks[k].pop();
        state.customHtmlByPage[k] = nextHtml;
        clearSelection();
        stageFrame.innerHTML = nextHtml;
        saveCustomStageHtml();
        elResetCustom.style.visibility = "visible";
        syncUndoButtons();
        persistState();
      }
      edUndo.addEventListener("click", doUndo);
      edRedo.addEventListener("click", doRedo);

      // Typography Actions
      elFontFamily.addEventListener("change", () => {
        if (!selectedEl || !elFontFamily.value) return;
        commitAction(() => { selectedEl.style.fontFamily = elFontFamily.value; });
      });
      elFontSize.addEventListener("change", () => {
        if (!selectedEl || !elFontSize.value) return;
        commitAction(() => { selectedEl.style.fontSize = elFontSize.value; });
        syncControlValuesFromSelected();
      });
      elFontUp.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => {
          const fs = parseFloat(getComputedStyle(selectedEl).fontSize) || 16;
          selectedEl.style.fontSize = `${Math.min(140, Math.round(fs + 2))}px`;
        });
        syncControlValuesFromSelected();
      });
      elFontDn.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => {
          const fs = parseFloat(getComputedStyle(selectedEl).fontSize) || 16;
          selectedEl.style.fontSize = `${Math.max(10, Math.round(fs - 2))}px`;
        });
        syncControlValuesFromSelected();
      });
      elBold.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => {
          const fw = parseInt(getComputedStyle(selectedEl).fontWeight, 10);
          selectedEl.style.fontWeight = (!Number.isNaN(fw) && fw >= 600) ? "400" : "800";
        });
        syncControlValuesFromSelected();
      });
      elItalic.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => {
          const isIt = getComputedStyle(selectedEl).fontStyle === "italic";
          selectedEl.style.fontStyle = isIt ? "normal" : "italic";
        });
        syncControlValuesFromSelected();
      });
      elUnderline.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => {
          const curDec = String(getComputedStyle(selectedEl).textDecorationLine || "");
          selectedEl.style.textDecoration = curDec.includes("underline") ? "none" : "underline";
        });
        syncControlValuesFromSelected();
      });
      elAlignLeft.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => { selectedEl.style.textAlign = "left"; });
        syncControlValuesFromSelected();
      });
      elAlignCenter.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => { selectedEl.style.textAlign = "center"; });
        syncControlValuesFromSelected();
      });
      elAlignRight.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => { selectedEl.style.textAlign = "right"; });
        syncControlValuesFromSelected();
      });
      elTextColor.addEventListener("change", () => {
        if (!selectedEl) return;
        commitAction(() => { selectedEl.style.color = elTextColor.value; });
      });

      // Box / Layer / Transform Actions
      elBgColor.addEventListener("change", () => {
        if (!selectedEl) return;
        commitAction(() => { selectedEl.style.backgroundColor = elBgColor.value; });
      });
      elBgTransparent.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => { selectedEl.style.backgroundColor = "transparent"; });
      });
      elBorderColor.addEventListener("change", () => {
        if (!selectedEl) return;
        commitAction(() => {
          if ((parseFloat(getComputedStyle(selectedEl).borderTopWidth) || 0) === 0) {
            selectedEl.style.borderWidth = "1.5px";
            selectedEl.style.borderStyle = "solid";
          }
          selectedEl.style.borderColor = elBorderColor.value;
        });
      });
      elBorderWidth.addEventListener("change", () => {
        if (!selectedEl) return;
        commitAction(() => {
          selectedEl.style.borderStyle = elBorderWidth.value === "0px" ? "none" : "solid";
          selectedEl.style.borderWidth = elBorderWidth.value;
          if (elBorderWidth.value !== "0px" && !selectedEl.style.borderColor) {
            selectedEl.style.borderColor = elBorderColor.value;
          }
        });
      });
      elRadius.addEventListener("change", () => {
        if (!selectedEl) return;
        commitAction(() => { selectedEl.style.borderRadius = elRadius.value; });
      });
      elBringForward.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => {
          const z = parseInt(getComputedStyle(selectedEl).zIndex, 10) || 4;
          selectedEl.style.position = getComputedStyle(selectedEl).position === "static" ? "relative" : getComputedStyle(selectedEl).position;
          selectedEl.style.zIndex = String(z + 2);
        });
      });
      elSendBackward.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => {
          const z = parseInt(getComputedStyle(selectedEl).zIndex, 10) || 4;
          selectedEl.style.position = getComputedStyle(selectedEl).position === "static" ? "relative" : getComputedStyle(selectedEl).position;
          selectedEl.style.zIndex = String(Math.max(1, z - 2));
        });
      });
      elScaleUp.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => {
          const t = parseTransform(selectedEl);
          applyTransform(selectedEl, t.tx, t.ty, +(t.sc + 0.1).toFixed(2));
        });
      });
      elScaleDn.addEventListener("click", () => {
        if (!selectedEl) return;
        commitAction(() => {
          const t = parseTransform(selectedEl);
          applyTransform(selectedEl, t.tx, t.ty, Math.max(0.3, +(t.sc - 0.1).toFixed(2)));
        });
      });
      elDuplicate.addEventListener("click", () => {
        const root = stageFrame.firstElementChild;
        if (!selectedEl || !root) return;
        let cloned = null;
        commitAction(() => {
          cloned = selectedEl.cloneNode(true);
          cloned.removeAttribute("data-edit-selected");
          cloned.removeAttribute("contenteditable");
          const t = parseTransform(selectedEl);
          cloned.style.position = "absolute";
          cloned.style.left = "96px";
          cloned.style.top = "96px";
          cloned.style.zIndex = "22";
          applyTransform(cloned, t.tx + 24, t.ty + 24, t.sc);
          cloned.dataset.atelierExtra="true";
          cloned.removeAttribute("data-content-path");
          cloned.querySelectorAll("[data-content-path]").forEach(n=>n.removeAttribute("data-content-path"));
          root.appendChild(cloned);
        });
        if (cloned) selectStageElement(cloned, false);
      });
      elDelete.addEventListener("click", () => {
        if (!selectedEl) return;
        const toDel = selectedEl;
        commitAction(() => {
          clearSelection();
          toDel.remove();
        });
      });

      // Insert Elements
      elAddText.addEventListener("click", () => {
        const root = stageFrame.firstElementChild;
        if (!root) return;
        let box = null;
        commitAction(() => {
          const tpl = SR.getTemplate(currentRecipe());
          box = document.createElement("div");
          box.textContent = "雙擊或點此輸入標題與內容";
          box.style.cssText = `position:absolute;left:96px;top:96px;z-index:20;padding:8px 14px;background:${tpl.surface};color:${tpl.fg};border:1.5px solid ${tpl.primary};font-family:${tpl.bodyFont};font-size:22px;font-weight:700;cursor:move;`;
          box.dataset.atelierExtra="true";
          root.appendChild(box);
        });
        if (box) selectStageElement(box, true);
      });

      elAddCard.addEventListener("click", () => {
        const root = stageFrame.firstElementChild;
        if (!root) return;
        let card = null;
        commitAction(() => {
          const tpl = SR.getTemplate(currentRecipe());
          card = document.createElement("div");
          card.textContent = "新增卡片重點區塊";
          card.style.cssText = `position:absolute;left:120px;top:140px;width:300px;height:140px;z-index:18;padding:18px;background:${tpl.tint};color:${tpl.fg};border:1.5px solid ${tpl.primary};border-radius:${tpl.radius}px;font-family:${tpl.bodyFont};font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:move;`;
          card.dataset.atelierExtra="true";
          root.appendChild(card);
        });
        if (card) selectStageElement(card, false);
      });

      elAddCircle.addEventListener("click", () => {
        const root = stageFrame.firstElementChild;
        if (!root) return;
        let cir = null;
        commitAction(() => {
          const tpl = SR.getTemplate(currentRecipe());
          cir = document.createElement("div");
          cir.textContent = "焦點";
          cir.style.cssText = `position:absolute;left:180px;top:160px;width:110px;height:110px;z-index:19;background:${tpl.primary};color:#FFFFFF;border-radius:999px;font-family:${tpl.titleFont};font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:move;`;
          cir.dataset.atelierExtra="true";
          root.appendChild(cir);
        });
        if (cir) selectStageElement(cir, true);
      });

      elAddLine.addEventListener("click", () => {
        const root = stageFrame.firstElementChild;
        if (!root) return;
        let line = null;
        commitAction(() => {
          const tpl = SR.getTemplate(currentRecipe());
          line = document.createElement("div");
          line.style.cssText = `position:absolute;left:140px;top:240px;width:360px;height:4px;z-index:18;background:${tpl.primary};cursor:move;`;
          line.dataset.atelierExtra="true";
          root.appendChild(line);
        });
        if (line) selectStageElement(line, false);
      });

      elAddImage.addEventListener("click", () => elImageInput.click());
      elImageInput.addEventListener("change", (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const root = stageFrame.firstElementChild;
          if (!root) return;
          let img = null;
          commitAction(() => {
            img = document.createElement("img");
            img.src = String(reader.result);
            img.alt = file.name;
            img.style.cssText = "position:absolute;left:140px;top:120px;width:360px;height:240px;object-fit:cover;z-index:20;border-radius:8px;cursor:move;border:1px solid rgba(0,0,0,0.12);";
            img.dataset.atelierExtra="true";
            root.appendChild(img);
          });
          if (img) selectStageElement(img, false);
        };
        reader.readAsDataURL(file);
        elImageInput.value = "";
      });

      elResetCustom.addEventListener("click", () => {
        const k = pageKey();
        delete state.customHtmlByPage[k];
        const previous=state.pageOverrides[state.page];
        if(typeof previous==="object") { if(previous.mode)state.pageOverrides[state.page]={mode:previous.mode};else delete state.pageOverrides[state.page]; }
        undoStacks[k] = [];
        redoStacks[k] = [];
        render();
      });

      // Sidebar Controls
      topicBar.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-topic]");
        if (!b) return;
        overridesByTopic[state.topic]=state.pageOverrides;
        state.topic = b.dataset.topic;
        state.page = 0;
        state.pageOverrides = overridesByTopic[state.topic] || {};
        render();
      });

      stylePresetBar.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-preset]");
        if (!b) return;
        const pr = (SR.STYLE_PRESETS || []).find((p) => p.id === b.dataset.preset);
        if (!pr) return;
        state.template = pr.templateId;
        state.color = pr.colorId;
        state.font = pr.fontId;
        state.customHtmlByPage = {};
        render();
      });

      layoutSwitcher.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-layout]");
        if (!b) return;
        const previous=state.pageOverrides[state.page];
        state.pageOverrides[state.page] = {...(typeof previous==="string"?{mode:previous}:previous||{}),mode:b.dataset.layout};
        delete state.customHtmlByPage[pageKey()];
        render();
      });

      resetPageBtn.addEventListener("click", () => {
        const previous=state.pageOverrides[state.page];
        if (previous?.content) state.pageOverrides[state.page]={content:previous.content};
        else delete state.pageOverrides[state.page];
        delete state.customHtmlByPage[pageKey()];
        render();
      });

      const getTotalPages = () => {
        const top = SR.TOPICS.find((t) => t.id === state.topic);
        return (top && top.count) ? top.count : 20;
      };

      pageSelect.addEventListener("change", (e) => { state.page = Number(e.target.value) || 0; render(); });
      document.getElementById("prevBtn").addEventListener("click", () => { const n = getTotalPages(); state.page = (state.page + n - 1) % n; render(); });
      document.getElementById("nextBtn").addEventListener("click", () => { const n = getTotalPages(); state.page = (state.page + 1) % n; render(); });

      window.addEventListener("keydown", (e) => {
        const active = document.activeElement;
        const inTyping = active && (active.isContentEditable || active === pageSelect || active.tagName === "SELECT" || active.tagName === "INPUT" || active.tagName === "TEXTAREA");
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !inTyping) {
          e.preventDefault();
          doUndo();
          return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y" && !inTyping) {
          e.preventDefault();
          doRedo();
          return;
        }
        if (inTyping) return;
        if (e.key === "ArrowLeft") { const n = getTotalPages(); state.page = (state.page + n - 1) % n; render(); }
        if (e.key === "ArrowRight") { const n = getTotalPages(); state.page = (state.page + 1) % n; render(); }
        if ((e.key === "Delete" || e.key === "Backspace") && selectedEl) {
          e.preventDefault();
          elDelete.click();
        }
      });

      downloadPptBtn.addEventListener("click", async () => {
        const orig = downloadPptBtn.textContent;
        downloadPptBtn.disabled = true;
        downloadPptBtn.textContent = "⏳ 正在逐元素產生可編輯 PPT...";
        try {
          const top = SR.TOPICS.find((t) => t.id === state.topic) || SR.TOPICS[0];
          const tpl = SR.getTemplate(currentRecipe());
          await window.SlidePptxExporter.exportDeck({
            topicId: state.topic,
            recipe: currentRecipe(),
            pageOverrides: state.pageOverrides,
            customHtmlByPage: state.customHtmlByPage,
            assetBase: "./assets/",
            deckTitle: `${top.shortLabel || top.label}-${tpl.name}`
          });
        } catch (err) {
          alert("匯出 PPT 失敗：" + (err?.message || err));
        } finally {
          downloadPptBtn.disabled = false;
          downloadPptBtn.textContent = orig;
        }
      });

      const editContentBtn=document.createElement("button");
      editContentBtn.type="button";editContentBtn.className="btn";editContentBtn.id="editContentBtn";editContentBtn.textContent="編輯本頁內容";
      resetPageBtn.parentElement.prepend(editContentBtn);
      const dialog=document.createElement("dialog");dialog.id="contentDialog";
      dialog.style.cssText="width:min(720px,94vw);max-height:90vh;border:1px solid #d7cebc;border-radius:12px;padding:24px;color:#1d2626;background:#fffdf9;";
      document.body.append(dialog);
      editContentBtn.addEventListener("click",()=>{
        const data=SR.getDeckPlan(currentRecipe(),state.pageOverrides,state.topic,"./assets/")[state.page];
        const labels={title:"標題",sub:"副標",summary:"摘要",kicker:"導讀標籤",notes:"講者備註／來源",desc:"說明",stat:"來源數據",action:"補充",statLabel:"數據標籤"};
        const fs=contentApi.fields(data).filter(f=>f.value && f.path!=="chapter");
        dialog.innerHTML='<h2 style="margin-top:0">編輯本頁內容</h2><p>文字與設計分開儲存；換風格、版面或主題後仍會保留。</p><form method="dialog" id="contentForm">'+fs.map(f=>{
          const parts=f.path.split(".");const label=(parts[0]==="points"?`要點 ${Number(parts[1])+1}・`:"")+(labels[parts.at(-1)]||parts.at(-1));
          return `<label style="display:block;margin:16px 0">${escapeText(label)}<textarea data-field="${escapeText(f.path)}" rows="${f.path==="notes"?4:2}" style="display:block;width:100%;padding:10px;margin-top:6px;font:16px/1.5 sans-serif;border:1px solid #d7cebc;border-radius:4px">${escapeText(f.value)}</textarea></label>`;
        }).join("")+'<div style="display:flex;gap:12px;position:sticky;bottom:-24px;background:#fffdf9;padding:16px 0"><button class="btn btn-primary" value="save">儲存內容</button><button class="btn" value="cancel">取消</button></div></form>';
        dialog.querySelector("form").addEventListener("submit",event=>{
          if(event.submitter?.value!=="save")return;
          const content=JSON.parse(JSON.stringify(data));
          dialog.querySelectorAll("[data-field]").forEach(el=>contentApi.set(content,el.dataset.field,el.value.trim()));
          if(!content.title){event.preventDefault();alert("請保留一個清楚的標題。");return;}
          pushHistory();
          const previous=state.pageOverrides[state.page];
          state.pageOverrides[state.page]={...(typeof previous==="string"?{mode:previous}:previous||{}),content};
          delete state.customHtmlByPage[pageKey()];render();
        });
        dialog.showModal();
      });
      render();
    })().catch(error=>{
      console.error(error);
      const message=document.createElement("p");message.setAttribute("role","alert");message.textContent=error.message;message.style.cssText="padding:24px;color:#9e3232;background:#fff;position:fixed;bottom:0;z-index:9999;";document.body.append(message);
    });
  </script>
</body>
</html>
